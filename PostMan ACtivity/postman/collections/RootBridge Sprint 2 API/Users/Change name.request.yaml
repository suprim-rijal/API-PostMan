$kind: http-request
url: "{{baseUrl}}/api/users/update"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "usr-202",
      "name": "Priya T."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 2xx', () => pm.response.to.be.success);
      pm.test('success is true', () => pm.expect(pm.response.json().success).to.eql(true));
    language: text/javascript
order: 3000
