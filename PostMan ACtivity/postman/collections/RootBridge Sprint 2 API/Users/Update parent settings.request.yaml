$kind: http-request
url: "{{baseUrl}}/api/users/update"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "usr-201",
      "details": {
        "parentSettings": {
          "childName": "Aarav",
          "dailyMinutes": 30,
          "weeklyGoalDays": 5,
          "allowedTracks": {
            "language": true,
            "culture": false
          },
          "allowSpeaking": true,
          "requirePin": true,
          "pin": "1234"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 2xx', () => pm.response.to.be.success);
      pm.test('success is true', () => pm.expect(pm.response.json().success).to.eql(true));
    language: text/javascript
order: 4000
