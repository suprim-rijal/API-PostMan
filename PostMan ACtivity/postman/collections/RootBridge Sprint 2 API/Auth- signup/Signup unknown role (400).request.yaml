$kind: http-request
url: "{{baseUrl}}/api/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "A",
      "email": "x@example.com",
      "password": "secret1",
      "role": "Pirate"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('success is false', () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 5000
